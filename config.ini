[ssh]
host = ...
port = 22
username = root
; SSH password is read from the AD_SSH_PASSWORD environment variable.

[paths]
remote_dir = ~/
remote_tar = ~/backup.tar.gz
local_tar = backup.tar.gz

[discord]
; REQUIRED: ID of the Discord server (guild) where you want to create the category/channels
guild_id = ...
; Discord bot token is read from the AD_DISCORD_TOKEN environment variable.

; OPTIONAL: reuse an existing category by name or numeric ID.
; leave empty to create a new one automatically.
category =
